# =============================================================================
# GitHub Actions CI для ЛР2.
#
# Архитектура:
#   * build-vidayapi собирает образы test-runner и postgres-test ОДИН раз,
#     пушит их в GitHub Container Registry (ghcr.io), собирает bootJar;
#   * тестовые джобы только docker pull + docker run/compose run;
#   * порядок Требования 5: unit -> integration -> e2e (через needs);
#   * report выполняется ВСЕГДА (if: !cancelled()), НЕ перезапускает тесты:
#     Allure собирается из allure-results*, пришедших артефактами;
#   * device: эмулятор Android (KVM) + API из jar-артефакта + стенд
#     (postgres со схемой/redis/minio через docker-compose.device.yml);
#   * Junit-отчёты публикуются аннотациями dorny/test-reporter;
#   * история Allure (тренды, Требование 9) — actions/cache.
#
# Раннеры:
#   * ubuntu-latest достаточно для ВСЕХ джоб (docker уже есть; KVM для
#     эмулятора на GitHub-hosted включён). Если используете СВОЙ раннер —
#     замените runs-on на [self-hosted, linux, x64] и убедитесь, что у него
#     есть Docker и /dev/kvm.
#   * Для пуша образов в ghcr.io нужен secret GITHUB_TOKEN (автоматический)
#     и разрешение packages: write (задано ниже).
#
# Запуск: push в main/master, pull request, вручную (workflow_dispatch).
# =============================================================================
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'vidayapi/**'
      - 'viday/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'vidayapi/**'
      - 'viday/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Не даём параллельным прогонам одного рефа мешать друг другу.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Имена образов ghcr.io вычисляются в каждой джобе шагом "Set GHCR image
  # names": docker требует lowercase в имени образа, а expression-язык GitHub
  # Actions не умеет lower() — поэтому используем ${VAR,,} в bash + $GITHUB_ENV.
  COMPOSE_FILE: docker/docker-compose.ci.yml
  COMPOSE_PROJECT_NAME: viday-ci-${{ github.run_id }}
  ALLURE_HISTORY_DIR: /workspace/allure-history
  GRADLE_CACHE: .gradle-ci

permissions:
  contents: write          # publish-reports пушит Allure/покрытие/Sonar на gh-pages
  packages: write          # build-vidayapi пушит образы в ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # STAGE: build
  # ---------------------------------------------------------------------------
  build-vidayapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidayapi
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image names (lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "TEST_RUNNER_IMAGE=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "POSTGRES_TEST_IMAGE=ghcr.io/${REPO}/postgres-test:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Gradle + Allure history
        uses: actions/cache/restore@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}
      # 1) контейнер запуска тестов (Требование 1): собирается один раз, дальше только pull
      - name: Build and push test-runner image
        run: |
          docker build -t "$TEST_RUNNER_IMAGE" -f docker/test-runner/Dockerfile .
          docker push "$TEST_RUNNER_IMAGE"
      # 2) postgres со схемой init 01..05 (Требование 4) — стенд CI + device
      - name: Build and push postgres-test image
        run: |
          docker build -t "$POSTGRES_TEST_IMAGE" docker/postgres
          docker push "$POSTGRES_TEST_IMAGE"
      # 3) bootJar backend'а — артефакт для device (java -jar) и curl-демо
      - name: Assemble backend bootJar
        run: |
          docker run --rm -u root \
            -v "$PWD:/workspace" \
            -v "$PWD/$GRADLE_CACHE:/cache/.gradle" \
            -e GRADLE_USER_HOME=/cache/.gradle \
            "$TEST_RUNNER_IMAGE" assemble
      - name: Upload bootJar artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidayapi-jar
          path: vidayapi/presentation/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Fix cache permissions (root-owned files from docker)
        if: always()
        run: chmod -R a+rX .gradle-ci allure-history 2>/dev/null || true
      - name: Save Gradle + Allure history cache
        if: always()
        continue-on-error: true   # параллельные джобы могут сохранять один ключ
        uses: actions/cache/save@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}

  build-viday:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viday
    steps:
      - uses: actions/checkout@v4
      - name: Cache Gradle + Android SDK
        uses: actions/cache@v4
        with:
          path: |
            viday/.gradle
            viday/.android-sdk
            viday/**/build
          key: viday-build-${{ hashFiles('viday/gradle/libs.versions.toml', 'viday/build.gradle.kts') }}
      - name: Install Android SDK
        run: bash scripts/ci-install-sdk.sh
        env:
          ANDROID_HOME: ${{ github.workspace }}/viday/.android-sdk
      - name: Assemble debug APK (early compile check)
        run: ./gradlew --no-daemon :app:assembleDebug
        env:
          ANDROID_HOME: ${{ github.workspace }}/viday/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/viday/.android-sdk

  # ---------------------------------------------------------------------------
  # STAGE: unit
  # ---------------------------------------------------------------------------
  unit-viday:
    needs: [build-viday]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viday
    steps:
      - uses: actions/checkout@v4
      - name: Cache Gradle + Android SDK
        uses: actions/cache@v4
        with:
          path: |
            viday/.gradle
            viday/.android-sdk
            viday/**/build
          key: viday-build-${{ hashFiles('viday/gradle/libs.versions.toml', 'viday/build.gradle.kts') }}
      - name: Install Android SDK
        run: bash scripts/ci-install-sdk.sh
        env:
          ANDROID_HOME: ${{ github.workspace }}/viday/.android-sdk
      - name: JVM unit tests + JaCoCo coverage
        run: |
          # literal block: переводы строк сохраняются, '\' — настоящий перенос команды
          ./gradlew --no-daemon :domain:test :data:testDebugUnitTest :app:testDebugUnitTest \
            :domain:jacocoTestReport :data:jacocoTestReport :app:jacocoTestReport
        env:
          ANDROID_HOME: ${{ github.workspace }}/viday/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/viday/.android-sdk
          GRADLE_USER_HOME: ${{ github.workspace }}/viday/.gradle
      - name: Publish JUnit report
        if: success() || failure()
        continue-on-error: true   # не маскируем реальную ошибку gradle отсутствием XML
        uses: dorny/test-reporter@v1
        with:
          name: Android unit tests (JUnit)
          path: viday/**/build/test-results/**/*.xml
          reporter: java-junit
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viday-unit-results
          path: |
            viday/app/build/reports/tests/
            viday/domain/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage (JaCoCo XML/HTML/CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viday-jacoco
          path: |
            viday/**/build/reports/jacoco/**/*.xml
            viday/**/build/reports/jacoco/**/html/**
            viday/**/build/reports/jacoco/**/*.csv
          if-no-files-found: ignore
          retention-days: 7

  unit-vidayapi:
    needs: [build-vidayapi]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidayapi
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image names (lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "TEST_RUNNER_IMAGE=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "POSTGRES_TEST_IMAGE=ghcr.io/${REPO}/postgres-test:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Gradle + Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run unit tests (LR1) in test-runner container
        run: |
          docker pull "$TEST_RUNNER_IMAGE"
          docker run --rm -u root \
            -v "$PWD:/workspace" \
            -v "$PWD/allure-history:/workspace/allure-history" \
            -v "$PWD/$GRADLE_CACHE:/cache/.gradle" \
            -e ALLURE_HISTORY_DIR=$ALLURE_HISTORY_DIR \
            -e GRADLE_USER_HOME=/cache/.gradle \
            "$TEST_RUNNER_IMAGE" unit
      - name: Publish JUnit report
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Backend unit tests (JUnit)
          path: vidayapi/application/build/test-results/test/**/*.xml, vidayapi/domain/build/test-results/test/**/*.xml, vidayapi/infrastructure/build/test-results/test/**/*.xml
          reporter: java-junit
      - name: Upload allure-results + JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidayapi-unit-results
          path: |
            vidayapi/**/build/allure-results/**/*
            vidayapi/application/build/test-results/test/**/*.xml
            vidayapi/domain/build/test-results/test/**/*.xml
            vidayapi/infrastructure/build/test-results/test/**/*.xml
            vidayapi/allure-history/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage (JaCoCo XML/HTML/CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidayapi-jacoco-unit
          path: |
            vidayapi/**/build/reports/jacoco/test/jacocoTestReport.xml
            vidayapi/**/build/reports/jacoco/test/jacocoTestReport.csv
            vidayapi/**/build/reports/jacoco/test/html/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Fix cache permissions (root-owned files from docker)
        if: always()
        run: chmod -R a+rX .gradle-ci allure-history 2>/dev/null || true
      - name: Save Gradle + Allure history cache
        if: always()
        continue-on-error: true   # параллельные джобы могут сохранять один ключ
        uses: actions/cache/save@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}

  # ---------------------------------------------------------------------------
  # STAGE: integration (Требования 2-4, 6, 10, 14)
  # ---------------------------------------------------------------------------
  integration-vidayapi:
    needs: [unit-vidayapi]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidayapi
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image names (lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "TEST_RUNNER_IMAGE=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "POSTGRES_TEST_IMAGE=ghcr.io/${REPO}/postgres-test:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Gradle + Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run integration tests on the LR2 stand
        run: |
          docker pull "$TEST_RUNNER_IMAGE"
          docker pull "$POSTGRES_TEST_IMAGE"
          docker compose -f $COMPOSE_FILE up -d postgres-test redis-test minio-test
          docker compose -f $COMPOSE_FILE run --rm -u root \
            -v "$PWD:/workspace" \
            -v "$PWD/allure-history:/workspace/allure-history" \
            -v "$PWD/$GRADLE_CACHE:/cache/.gradle" \
            -e ALLURE_HISTORY_DIR=$ALLURE_HISTORY_DIR \
            -e GRADLE_USER_HOME=/cache/.gradle \
            test-runner integration
      - name: Tear down stand
        if: always()
        run: docker compose -f $COMPOSE_FILE down -v || true
      - name: Publish JUnit report
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Integration tests (JUnit)
          path: vidayapi/infrastructure/build/test-results/testIntegration/**/*.xml
          reporter: java-junit
      - name: Upload allure-results-it + JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidayapi-it-results
          path: |
            vidayapi/infrastructure/build/allure-results-it/**/*
            vidayapi/infrastructure/build/test-results/testIntegration/**/*.xml
            vidayapi/allure-history/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fix cache permissions (root-owned files from docker)
        if: always()
        run: chmod -R a+rX .gradle-ci allure-history 2>/dev/null || true
      - name: Save Gradle + Allure history cache
        if: always()
        continue-on-error: true   # параллельные джобы могут сохранять один ключ
        uses: actions/cache/save@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}

  # ---------------------------------------------------------------------------
  # STAGE: e2e (Задание 3, Требование 13)
  # ---------------------------------------------------------------------------
  e2e-vidayapi:
    needs: [integration-vidayapi]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidayapi
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image names (lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "TEST_RUNNER_IMAGE=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "POSTGRES_TEST_IMAGE=ghcr.io/${REPO}/postgres-test:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Gradle + Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run E2E MVP scenario
        run: |
          docker pull "$TEST_RUNNER_IMAGE"
          docker pull "$POSTGRES_TEST_IMAGE"
          docker compose -f $COMPOSE_FILE up -d postgres-test redis-test minio-test
          docker compose -f $COMPOSE_FILE run --rm -u root \
            -v "$PWD:/workspace" \
            -v "$PWD/allure-history:/workspace/allure-history" \
            -v "$PWD/$GRADLE_CACHE:/cache/.gradle" \
            -e ALLURE_HISTORY_DIR=$ALLURE_HISTORY_DIR \
            -e GRADLE_USER_HOME=/cache/.gradle \
            test-runner e2e
      - name: Tear down stand
        if: always()
        run: docker compose -f $COMPOSE_FILE down -v || true
      - name: Publish JUnit report
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: E2E tests (JUnit)
          path: vidayapi/presentation/build/test-results/testE2E/**/*.xml
          reporter: java-junit
      - name: Upload allure-results-e2e + JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidayapi-e2e-results
          path: |
            vidayapi/presentation/build/allure-results-e2e/**/*
            vidayapi/presentation/build/test-results/testE2E/**/*.xml
            vidayapi/allure-history/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fix cache permissions (root-owned files from docker)
        if: always()
        run: chmod -R a+rX .gradle-ci allure-history 2>/dev/null || true
      - name: Save Gradle + Allure history cache
        if: always()
        continue-on-error: true   # параллельные джобы могут сохранять один ключ
        uses: actions/cache/save@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}

  # ---------------------------------------------------------------------------
  # STAGE: device — тесты Android НА УСТРОЙСТВЕ (Требование 7).
  # Эмулятор: reactivecircus/android-emulator-runner (нужен KVM). API стенда
  # поднимается на хосте из jar-артефакта build-vidayapi; postgres (со схемой)/
  # redis/minio — docker-compose.device.yml с опубликованными портами.
  # ---------------------------------------------------------------------------
  device-viday:
    needs: [build-viday, build-vidayapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image names (lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "TEST_RUNNER_IMAGE=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "POSTGRES_TEST_IMAGE=ghcr.io/${REPO}/postgres-test:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Download backend bootJar
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vidayapi-jar
          path: vidayapi
      - name: Cache Android SDK + Gradle
        uses: actions/cache@v4
        with:
          path: |
            viday/.gradle
            viday/.android-sdk
            viday/**/build
          key: viday-build-${{ hashFiles('viday/gradle/libs.versions.toml', 'viday/build.gradle.kts') }}
      - name: Setup Java 17 (для bootJar на хосте)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK (for host-side adb/gradle)
        run: bash viday/scripts/ci-install-sdk.sh
        env:
          ANDROID_HOME: ${{ github.workspace }}/viday/.android-sdk
          INSTALL_EMULATOR: "1"
          ANDROID_EMULATOR_TARGET: "aosp_atd"
      - name: Login to GHCR and start device stand
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$POSTGRES_TEST_IMAGE"
          docker compose -f vidayapi/docker/docker-compose.device.yml up -d
          # postgres: порт открывается до завершения init-скриптов 01..05
          timeout 120 bash -c 'until (echo > /dev/tcp/localhost/55432) 2>/dev/null; do sleep 2; done'
          sleep 10
          timeout 120 bash -c 'until (echo > /dev/tcp/localhost/56380) 2>/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until (echo > /dev/tcp/localhost/59002) 2>/dev/null; do sleep 2; done'
      - name: Start API (bootJar from build-vidayapi)
        run: |
          JAR=$(ls "$GITHUB_WORKSPACE"/vidayapi/presentation/build/libs/viday-application-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "WARN: API jar отсутствует — AndroidApiFlowTest будет SKIPPED (assumeTrue)"
          else
            export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:55432/viday"
            export SPRING_DATASOURCE_USERNAME="viday_admin_user"
            export SPRING_DATASOURCE_PASSWORD="admin_password_change_me"
            export SPRING_DATA_REDIS_HOST="localhost"
            export SPRING_DATA_REDIS_PORT="56380"
            export MINIO_ENDPOINT="http://localhost:59002"
            export MINIO_PUBLIC_ENDPOINT="http://localhost:59002"
            export VIDAY_CONSOLE_ENABLED="false"
            nohup java -jar "$JAR" --server.port=8080 > /tmp/viday-api.log 2>&1 &
            echo $! > /tmp/viday-api.pid
            timeout 240 bash -c 'until (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; do sleep 3; done' \
              || echo "WARN: API не поднялся за 240s (лог: /tmp/viday-api.log)"
          fi
      - name: Emulator environment check
        run: |
          ls -l /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -2 || true
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null \
            | grep -E "system-images;|^emulator|platform-tools" || true
        env:
          ANDROID_HOME: ${{ github.workspace }}/viday/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/viday/.android-sdk
      - name: Instrumented tests on emulator (Требование 7)
        # ВАЖНО: на GitHub-hosted Linux-раннерах приватных репозиториев KVM нет
        # ("hardware acceleration is not available") — эмулятор работает в
        # программном режиме. Поэтому используем aosp_atd (ATD): облегчённый
        # образ для headless-CI, который реально успевает загрузиться в TCG.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048
          emulator-boot-timeout: 900
          force-avd-creation: true
          disable-animations: true
          working-directory: viday
          script: |
            adb reverse tcp:8080 tcp:8080 || echo "WARN: reverse failed (тест будет SKIPPED)"
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
        env:
          ANDROID_HOME: ${{ github.workspace }}/viday/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/viday/.android-sdk
          GRADLE_USER_HOME: ${{ github.workspace }}/viday/.gradle
      - name: Publish JUnit report
        if: success() || failure()
        continue-on-error: true   # эмулятор мог упасть до появления результатов
        uses: dorny/test-reporter@v1
        with:
          name: Device tests (JUnit)
          path: viday/app/build/outputs/androidTest-results/connected/**/*.xml
          reporter: java-junit
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viday-device-results
          path: |
            viday/app/build/reports/androidTests/connected/
            viday/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down device stand
        if: always()
        run: docker compose -f vidayapi/docker/docker-compose.device.yml down -v || true

  # ---------------------------------------------------------------------------
  # STAGE: report — Allure ВСЕГДА (Требование 8), без повторного прогона тестов.
  # Стенд не нужен: отчёт генерируется из allure-results*, пришедших артефактами.
  # ---------------------------------------------------------------------------
  report-vidayapi:
    needs: [unit-vidayapi, integration-vidayapi, e2e-vidayapi]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidayapi
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image names (lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "TEST_RUNNER_IMAGE=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "POSTGRES_TEST_IMAGE=ghcr.io/${REPO}/postgres-test:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Gradle + Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Download unit allure-results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vidayapi-unit-results
      - name: Download integration allure-results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vidayapi-it-results
      - name: Download e2e allure-results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vidayapi-e2e-results
      - name: Download unit coverage (JaCoCo XML/HTML) для Allure
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vidayapi-jacoco-unit
      - name: Generate Allure report from existing results (no re-run)
        run: |
          docker pull "$TEST_RUNNER_IMAGE"
          docker run --rm -u root \
            -v "$PWD:/workspace" \
            -v "$PWD/allure-history:/workspace/allure-history" \
            -v "$PWD/$GRADLE_CACHE:/cache/.gradle" \
            -e ALLURE_HISTORY_DIR=$ALLURE_HISTORY_DIR \
            -e GRADLE_USER_HOME=/cache/.gradle \
            "$TEST_RUNNER_IMAGE" report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ci
          path: |
            vidayapi/build/reports/allure-report-ci/
            vidayapi/allure-history/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fix cache permissions (root-owned files from docker)
        if: always()
        run: chmod -R a+rX .gradle-ci allure-history 2>/dev/null || true
      - name: Save Gradle + Allure history cache
        if: always()
        continue-on-error: true   # параллельные джобы могут сохранять один ключ
        uses: actions/cache/save@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}

  # ---------------------------------------------------------------------------
  # STAGE: sonar — SonarQube анализ backend'а (coverage tree-view + quality).
  # Сервер поднимается прямо в джобе через docker-compose.sonar.yml; токен
  # генерируется через REST API (свежий сервер, admin/admin). Джоба НЕ блокирует
  # конвейер (continue-on-error), результат скана публикуется артефактом.
  # ---------------------------------------------------------------------------
  sonar-vidayapi:
    # Скан запускается ПОСЛЕ всех тестовых стадий backend'а: покрытие и
    # результаты должны быть итоговыми (unit + integration + e2e уже прошли).
    needs: [unit-vidayapi, integration-vidayapi, e2e-vidayapi]
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidayapi
    steps:
      - uses: actions/checkout@v4
      - name: Set GHCR image names (lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "TEST_RUNNER_IMAGE=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "POSTGRES_TEST_IMAGE=ghcr.io/${REPO}/postgres-test:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO}/test-runner:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Gradle + Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Start SonarQube server
        run: |
          docker compose -f docker/docker-compose.sonar.yml up -d
          timeout 600 bash -c \
            'until curl -fsS http://localhost:9002/api/system/status | grep -q "UP"; do sleep 5; done' \
            || { docker compose -f docker/docker-compose.sonar.yml logs; exit 1; }
      - name: Generate SonarQube analysis token
        run: |
          # Если задан secret SONAR_TOKEN (свой сервер) — используем его,
          # иначе генерируем токен на свежем локальном инстансе (admin/admin).
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}" >> "$GITHUB_ENV"
          else
            TOKEN=$(curl -fsS -u admin:admin -X POST "http://localhost:9002/api/user_tokens/generate" \
              -d "name=ci-${{ github.run_id }}" \
              | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
            echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          fi
      - name: Run SonarQube analysis (unit tests + JaCoCo + scan)
        run: |
          docker pull "$TEST_RUNNER_IMAGE"
          docker run --rm --network host -u root \
            -v "$PWD:/workspace" \
            -v "$PWD/$GRADLE_CACHE:/cache/.gradle" \
            -e GRADLE_USER_HOME=/cache/.gradle \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -e SONAR_HOST_URL="http://localhost:9002" \
            "$TEST_RUNNER_IMAGE" sonar
      - name: Upload SonarQube scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidayapi-sonar-report
          path: vidayapi/build/sonar/
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down SonarQube
        if: always()
        run: docker compose -f docker/docker-compose.sonar.yml down -v || true
      - name: Fix cache permissions (root-owned files from docker)
        if: always()
        run: chmod -R a+rX .gradle-ci allure-history 2>/dev/null || true
      - name: Save Gradle + Allure history cache
        if: always()
        continue-on-error: true   # параллельные джобы могут сохранять один ключ
        uses: actions/cache/save@v4
        with:
          path: |
            vidayapi/.gradle-ci
            vidayapi/allure-history
          key: vidayapi-cache-${{ hashFiles('vidayapi/build.gradle.kts', 'vidayapi/settings.gradle.kts', 'vidayapi/gradle/wrapper/gradle-wrapper.properties') }}

  # ---------------------------------------------------------------------------
  # STAGE: publish — итоговые отчёты в git-ветку gh-pages.
  # Проблема: Allure-отчёт, открытый локально через file://, показывает только
  # загрузку (SPA читает данные через fetch — file:// блокирует). Деплой в ветку
  # даёт просмотр по https://<owner>.github.io/<repo>/allure/ в браузере.
  # Структура ветки gh-pages (keep_files сохраняет старое между прогонами):
  #   allure/ | coverage/{viday,vidayapi}/<module>/ | sonar/ | index.html
  # ---------------------------------------------------------------------------
  publish-reports:
    needs: [report-vidayapi, unit-viday, sonar-vidayapi]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-report-ci
          path: tmp/allure
      - name: Download Android coverage (JaCoCo)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: viday-jacoco
          path: tmp/coverage-viday
      - name: Download backend coverage (JaCoCo)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vidayapi-jacoco-unit
          path: tmp/coverage-vidayapi
      - name: Download SonarQube scanner report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vidayapi-sonar-report
          path: tmp/sonar
      - name: Stage reports for gh-pages
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          rm -rf _reports
          mkdir -p _reports/allure _reports/coverage/viday _reports/coverage/vidayapi _reports/sonar
          # Allure: внутри артефакта отчёт лежит по vidayapi/build/reports/allure-report-ci/
          if [ -d tmp/allure/vidayapi/build/reports/allure-report-ci ]; then
            cp -r tmp/allure/vidayapi/build/reports/allure-report-ci/. _reports/allure/
            echo "Allure staged ($(find _reports/allure -name index.html | wc -l) index.html)"
          fi
          # Покрытие viday: вид структуры tmp/coverage-viday/viday/app/build/reports/jacoco/.../html/
          for d in $(find tmp/coverage-viday -path "*reports/jacoco*html" -type d 2>/dev/null | sort); do
            mod=$(echo "$d" | sed -E 's#tmp/coverage-viday/viday/([^/]+)/.*#\1#')
            mkdir -p "_reports/coverage/viday/$mod"
            cp -r "$d/." "_reports/coverage/viday/$mod/"
          done
          # Покрытие vidayapi: tmp/coverage-vidayapi/vidayapi/<module>/build/reports/jacoco/test/html/
          for d in $(find tmp/coverage-vidayapi -path "*reports/jacoco*html" -type d 2>/dev/null | sort); do
            mod=$(echo "$d" | sed -E 's#tmp/coverage-vidayapi/vidayapi/([^/]+)/.*#\1#')
            mkdir -p "_reports/coverage/vidayapi/$mod"
            cp -r "$d/." "_reports/coverage/vidayapi/$mod/"
          done
          # SonarQube scanner report (report-task.txt)
          if [ -d tmp/sonar ] && [ -n "$(ls -A tmp/sonar 2>/dev/null)" ]; then
            cp -r tmp/sonar/. _reports/sonar/
          fi
          # Лендинг со ссылками
          cat > _reports/index.html <<EOF
          <!DOCTYPE html>
          <html lang="ru"><head><meta charset="utf-8"><title>viday — отчёты CI</title></head>
          <body style="font-family:sans-serif;margin:2rem">
            <h1>Отчёты viday · CI run #${RUN_NUMBER}</h1>
            <ul>
              <li><a href="allure/">Allure report (unit + integration + e2e + coverage)</a></li>
              <li><a href="coverage/viday/app/">Покрытие viday :app</a></li>
              <li><a href="coverage/viday/data/">Покрытие viday :data</a></li>
              <li><a href="coverage/vidayapi/">Покрытие vidayapi</a></li>
              <li><a href="sonar/">SonarQube scanner report</a></li>
            </ul>
            <p>Обновлено: $(date -u)</p>
          </body></html>
          EOF
          echo "=== staged tree (maxdepth 3) ==="
          find _reports -maxdepth 3 | sort | head -50
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _reports
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Reports (Allure + coverage + Sonar): run #${{ github.run_number }}"