# =============================================================================
# ЛР3 — стенд визуализации микробенчмарка: Grafana + PostgreSQL с результатами.
#
# Отчёт и ВСЕ графики ЛР3 перенесены в Grafana (новое требование):
#   • benchmark-db — PostgreSQL, куда скрипт scripts/import-benchmark-to-db.sh
#     импортирует report.json каждого прогона (таблицы benchmark_*);
#   • grafana       — дашборд «LR3 Benchmark» (провижининг в
#     docker/grafana/provisioning): все таблицы отчёта + все графики
#     (временные ряды, CDF, гистограммы, столбцы перцентилей) для трёх
#     моделей x1/x4/x8.
#
# Запуск:   make grafana-up        -> Grafana на http://localhost:3000 (admin/admin)
#           make benchmark         -> прогон бенчмарка + автоимпорт в БД
#           make benchmark-import  -> импорт последнего report.json в БД
#           make grafana-down      -> остановить стенд
# =============================================================================
services:
  benchmark-db:
    image: postgres:15-alpine
    container_name: viday_bench_postgres
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark_user
      POSTGRES_PASSWORD: benchmark_password
    ports:
      - "5434:5432"
    volumes:
      - bench_postgres_data:/var/lib/postgresql/data
      - ./grafana/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark_user -d benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - viday_grafana_network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: viday_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      benchmark-db:
        condition: service_healthy
    networks:
      - viday_grafana_network

volumes:
  bench_postgres_data:
  grafana_data:

networks:
  viday_grafana_network:
    driver: bridge