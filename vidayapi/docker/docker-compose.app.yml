# =============================================================================
# Приложение vidayapi в контейнере поверх тестового стенда.
# Используется ТОЛЬКО для демонстрации (Задание 5): имитация E2E-действий
# через curl + захват трафика tcpdump'ом внутри контейнера.
#
# Требует поднятый стенд:
#   docker compose -f docker/docker-compose.test.yml up -d
#
# Запуск приложения:
#   docker compose -f docker/docker-compose.app.yml up -d --build
#   curl http://localhost:8080/api/videos
#
# ВАЖНО: network_mode: host работает только на Linux — приложение слушает
# localhost:8080 прямо на хосте и видит тестовый стенд через localhost-порты.
# =============================================================================
name: viday-test-app

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: viday_api
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: ${VIDAY_TEST_JDBC_URL:-jdbc:postgresql://localhost:55432/viday}
      SPRING_DATASOURCE_USERNAME: viday_admin_user
      SPRING_DATASOURCE_PASSWORD: admin_password_change_me
      SPRING_DATA_REDIS_HOST: ${VIDAY_TEST_REDIS_HOST:-localhost}
      SPRING_DATA_REDIS_PORT: ${VIDAY_TEST_REDIS_PORT:-56380}
      MINIO_ENDPOINT: ${VIDAY_TEST_MINIO_ENDPOINT:-http://localhost:59002}
      MINIO_PUBLIC_ENDPOINT: ${VIDAY_TEST_MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:59002}
      VIDAY_CONSOLE_ENABLED: "false"
      # Отключаем access log-файл в контейнере (пишем в stdout через console pattern)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"