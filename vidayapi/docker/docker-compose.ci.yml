# =============================================================================
# CI/CD-оркестрация ЛР2: три разных образа (postgres со схемой, API, e2e/test-runner)
# в одной docker-сети.
#
#   docker compose -f docker/docker-compose.ci.yml run --rm test-runner full
#
# ВНИМАНИЕ: у файла НЕТ поля `name:` — имя проекта задаётся снаружи
# (COMPOSE_PROJECT_NAME в GitHub Actions, `-p` локально), чтобы параллельные
# прогоны на одном хосте не пересекались.
# =============================================================================
services:
  postgres-test:
    image: ${POSTGRES_TEST_IMAGE:-viday-postgres-test:local}
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: viday
      POSTGRES_USER: viday_admin_user
      POSTGRES_PASSWORD: admin_password_change_me
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viday_admin_user -d viday"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:7-alpine
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-test:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: ${API_IMAGE:-viday-api:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/viday
      SPRING_DATASOURCE_USERNAME: viday_admin_user
      SPRING_DATASOURCE_PASSWORD: admin_password_change_me
      SPRING_DATA_REDIS_HOST: redis-test
      SPRING_DATA_REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://minio-test:9000
      MINIO_PUBLIC_ENDPOINT: http://minio-test:9000
      VIDAY_CONSOLE_ENABLED: "false"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/videos"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s

  e2e-runner:
    image: ${E2E_RUNNER_IMAGE:-viday-e2e-runner:local}
    build:
      context: ..
      dockerfile: docker/e2e/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      VIDAY_API_BASE: http://api:8080
    volumes:
      - ..:/workspace
    working_dir: /workspace

  test-runner:
    image: ${IMAGE_NAME:-viday-test-runner:local}
    build:
      context: ..
      dockerfile: docker/test-runner/Dockerfile
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    environment:
      VIDAY_TEST_JDBC_URL: jdbc:postgresql://postgres-test:5432/viday
      VIDAY_TEST_DB_USER: viday_admin_user
      VIDAY_TEST_DB_PASSWORD: admin_password_change_me
      VIDAY_TEST_REDIS_HOST: redis-test
      VIDAY_TEST_REDIS_PORT: "6379"
      VIDAY_TEST_MINIO_ENDPOINT: http://minio-test:9000
      GRADLE_USER_HOME: /home/gradle/.gradle
      VIDAYAPI_ROOT: /workspace
    volumes:
      - ..:/workspace
      - gradle_cache:/home/gradle/.gradle

volumes:
  postgres_test_data:
  gradle_cache:
