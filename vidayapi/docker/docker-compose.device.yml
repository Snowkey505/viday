# =============================================================================
# Стенд для тестов Android НА УСТРОЙСТВЕ (Требование 7 ЛР2).
#
# В отличие от docker-compose.test.yml (внутренняя сеть без проброса портов),
# здесь порты опубликованы на хосте: API стенда запускается НА ХОСТЕ через
# java -jar из bootJar-артефакта CI и обращается к сервисам по localhost.
#
# Используется:
#   * GitHub Actions (джоба device-viday, .github/workflows/ci.yml);
#   * локально:  docker compose -f docker/docker-compose.device.yml up -d
#                (приложение: make run, затем adb reverse tcp:8080 tcp:8080)
#
# Постгрес — образ со ВСТРОЕННОЙ схемой (init 01..05), идентичный при каждом
# запуске (Требование 4). Порт 55432/56380/59002 не пересекаются с dev-стеком.
# =============================================================================
name: viday-device

services:
  postgres-test:
    image: ${POSTGRES_TEST_IMAGE:-viday-postgres-test:local}
    environment:
      POSTGRES_DB: viday
      POSTGRES_USER: viday_admin_user
      POSTGRES_PASSWORD: admin_password_change_me
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viday_admin_user -d viday"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:7-alpine
    command: redis-server --appendonly no
    ports:
      - "${TEST_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-test:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "${TEST_MINIO_PORT:-59002}:9000"
      - "${TEST_MINIO_CONSOLE_PORT:-59003}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30