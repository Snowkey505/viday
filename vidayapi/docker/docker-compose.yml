services:
  postgres:
    image: postgres:15-alpine
    container_name: viday_postgres
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      POSTGRES_DB: viday
      POSTGRES_USER: viday_admin_user
      POSTGRES_PASSWORD: admin_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viday_admin_user -d viday"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viday_network
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements

  redis:
    image: redis:7-alpine
    container_name: viday_redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viday_network

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: viday_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viday_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  viday_network:
    driver: bridge
