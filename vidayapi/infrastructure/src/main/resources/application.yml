spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/viday
    username: viday_app_user
    password: app_password_change_me
    driver-class-name: org.postgresql.Driver
    # См. presentation/src/main/resources/application.yml: SQL задаётся
    # программно в RlsDataSourcePostProcessor (Spring Boot 4 + Hikari).

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    accesslog:
      enabled: true
      pattern: '%t %a %r %s %D'
      directory: logs

minio:
  endpoint: http://localhost:9000
  public-endpoint: http://192.168.255.112:9000
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1

logging:
  level:
    com.vidayapi: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.apache.coyote: DEBUG
    org.apache.tomcat: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.boot.web.embedded.tomcat: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/viday.log
    max-size: 10MB
    total-size-cap: 100MB
    max-history: 30

business:
  video:
    max-duration-seconds: 3600
    allowed-formats:
      - video/mp4
      - video/webm
      - video/avi
    max-file-size-mb: 500
  user:
    default-role: USER

jwt:
  # Ключ подписи берётся из окружения (см. JwtSecretProvider). Если JWT_SECRET
  # не задан, генерируется эфемерный ключ на процесс.
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ЛР5: политика аутентификации (2FA, лимит попыток, блокировка, ротация).
viday:
  auth:
    max-login-attempts: ${VIDAY_AUTH_MAX_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${VIDAY_AUTH_LOCK_DURATION_MINUTES:15}
    password-rotation-days: ${VIDAY_AUTH_PASSWORD_ROTATION_DAYS:90}
    two-factor-code-ttl-minutes: ${VIDAY_AUTH_TWO_FACTOR_TTL_MINUTES:5}
    two-factor-max-attempts: ${VIDAY_AUTH_TWO_FACTOR_MAX_ATTEMPTS:5}
    password-change-token-ttl-minutes: ${VIDAY_AUTH_PASSWORD_CHANGE_TTL_MINUTES:10}