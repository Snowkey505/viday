viday:
  console:
    enabled: false
  cache:
    enabled: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

minio:
  endpoint: http://localhost:9000
  # Public URLs served to clients. For a USB device (adb reverse tcp:9000 tcp:9000)
  # the phone reaches MinIO through the same loopback tunnel as the API.
  public-endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/viday
    username: viday_app_user
    password: app_password_change_me
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: RESET ROLE; RESET app.current_user_id;
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  mvc:
    log-request-details: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}

server:
  tomcat:
    max-http-form-post-size: 110MB
    max-swallow-size: 110MB
    connection-timeout: 5m
  max-http-header-size: 32768

logging:
  level:
    com.vidayapi: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.apache.coyote: DEBUG
    org.apache.tomcat: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.boot.web.embedded.tomcat: DEBUG
    org.springframework.data.redis: DEBUG
    redis.clients.jedis: DEBUG
    io.lettuce.core: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.web.multipart: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/viday.log
    max-size: 10MB
    total-size-cap: 100MB
    max-history: 30