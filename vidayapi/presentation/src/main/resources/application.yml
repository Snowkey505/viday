viday:
  console:
    enabled: false
  cache:
    enabled: true
  # ЛР5: политика аутентификации. Значения можно переопределить переменными
  # окружения без пересборки; тестовый стенд использует дефолты.
  auth:
    max-login-attempts: ${VIDAY_AUTH_MAX_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${VIDAY_AUTH_LOCK_DURATION_MINUTES:15}
    password-rotation-days: ${VIDAY_AUTH_PASSWORD_ROTATION_DAYS:90}
    two-factor-code-ttl-minutes: ${VIDAY_AUTH_TWO_FACTOR_TTL_MINUTES:5}
    two-factor-max-attempts: ${VIDAY_AUTH_TWO_FACTOR_MAX_ATTEMPTS:5}
    password-change-token-ttl-minutes: ${VIDAY_AUTH_PASSWORD_CHANGE_TTL_MINUTES:10}

jwt:
  # Ключ подписи НЕ хранится в репозитории. В CI/production задаётся
  # JWT_SECRET (GitHub Actions secret / GitLab CI variable / Vault).
  # Если переменная не задана, приложение генерирует эфемерный ключ на процесс
  # (см. JwtSecretProvider) — удобно для локального запуска, но токены
  # перестают действовать после рестарта.
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Public URLs served to clients. For a USB device (adb reverse tcp:9000 tcp:9000)
  # the phone reaches MinIO through the same loopback tunnel as the API.
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  region: ${MINIO_REGION:us-east-1}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/viday}
    username: ${SPRING_DATASOURCE_USERNAME:viday_app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:app_password_change_me}
    driver-class-name: org.postgresql.Driver
    # connection-init-sql задаётся в RlsDataSourcePostProcessor ДО старта пула:
    # Spring Boot 4 биндит свойства HikariDataSource после инициализации, и
    # YAML-свойство connection-init-sql падает с «pool is sealed once started».
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  mvc:
    log-request-details: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}

server:
  tomcat:
    max-http-form-post-size: 110MB
    max-swallow-size: 110MB
    connection-timeout: 5m
  max-http-header-size: 32768

# ЛР4: endpoint /actuator/prometheus для Prometheus (JVM, GC, HTTP, HikariCP).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: vidayapi
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

logging:
  level:
    com.vidayapi: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.apache.coyote: DEBUG
    org.apache.tomcat: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.boot.web.embedded.tomcat: DEBUG
    org.springframework.data.redis: DEBUG
    redis.clients.jedis: DEBUG
    io.lettuce.core: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.web.multipart: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/viday.log
    max-size: 10MB
    total-size-cap: 100MB
    max-history: 30